{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>{{ word.word_text }}</h3>
        </div>
        <div class="card-body">
            <p><strong>よみがな:</strong> {{ word.pronunciation }} 
                <!-- 발음 수정 버튼 -->
                <a href="{% url 'language_learning:edit_pronunciation' word.id %}" class="btn btn-secondary btn-sm">수정</a>
            </p>
            <p><strong>分類:</strong> {{ word.category }}
                <!-- 분류 수정 버튼 -->
                <a href="{% url 'language_learning:edit_category' word.id %}" class="btn btn-secondary btn-sm">수정</a>
            </p>
        </div>
        <div class="card-footer">
            <a href="{% url 'language_learning:index' %}" class="btn btn-secondary">돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}
