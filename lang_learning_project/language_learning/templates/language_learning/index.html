{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>단어 목록</h1>
    <ul>
        {% for word in words %}
            <li>
                <strong>
                    <a href="{% url 'language_learning:word_detail' word.id %}">{{ word.word_text }}</a>
                </strong>: {{ word.meaning }}
                <a href="{% url 'language_learning:word_update' word.id %}">수정</a>
                <form action="{% url 'language_learning:word_delete' word.id %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">삭제</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'language_learning:word_create' %}">새 단어 추가</a>
    <a href="{% url 'language_learning:quiz' %}" class="btn btn-primary">QUIZ</a>
</div>
{% endblock %}
