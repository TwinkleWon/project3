{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3>퀴즈 결과</h3>
        </div>
        <div class="card-body">
            {% if correct %}
                <p>정답입니다!</p>
            {% else %}
                <p>틀렸습니다. 정답은 "{{ word.meaning }}"입니다.</p>
            {% endif %}
        </div>
        <div class="card-footer">
            <a href="{% url 'language_learning:quiz' %}" class="btn btn-primary">다시 풀기</a>
            <a href="{% url 'language_learning:index' %}" class="btn btn-secondary">돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}
