<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>단어장</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap');
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css');
        
        body {
            margin: 0;
            font-family: 'Nanum Myeongjo', serif;
            background-image: url('https://cdn.pixabay.com/photo/2020/07/26/14/43/cherry-blossom-5439750_960_720.png'); /* 배경 이미지 URL */
            background-size: cover; /* 배경 이미지가 화면 전체를 덮도록 설정 */
            background-position: center; /* 배경 이미지의 위치를 중앙으로 설정 */
            background-repeat: no-repeat; /* 배경 이미지 반복 방지 */
            background-attachment: fixed; /* 배경 이미지를 고정하여 스크롤 시에도 배경이 움직이지 않도록 설정 */
            color: #333;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.9); /* 반투명 흰색 배경 */
            border-bottom: 2px solid #e29c8f;
        }

        .navbar-brand {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.5rem;
            color: #b74e34;
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            margin-right: 10px;
            color: #f76c6c;
        }

        .navbar-nav .nav-item .nav-link {
            font-size: 1rem;
            color: #b74e34;
            transition: color 0.3s;
        }

        .navbar-nav .nav-item .nav-link:hover {
            text-decoration: none;
            color: #f76c6c;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9); /* 카드 배경에 반투명 흰색을 추가하여 배경 이미지와 대비 */
            border: 1px solid #e29c8f;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-header {
            background-color: #f76c6c;
            color: white;
            border-bottom: 2px solid #e29c8f;
            font-family: 'Nanum Myeongjo', serif;
            text-align: center;
            padding: 10px;
            border-radius: 10px 10px 0 0;
        }

        .list-group-item {
            background-color: #ffffff;
            border: 1px solid #e29c8f;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .btn-primary {
            background-color: #b74e34;
            border-color: #b74e34;
        }

        .btn-warning {
            background-color: #d99d70;
            border-color: #d99d70;
        }

        .btn-danger {
            background-color: #b74e34;
            border-color: #b74e34;
        }

        .span-todo-text a {
            color: #b74e34;
            text-decoration: none;
        }

        .span-todo-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mx-auto">
                    <li class="nav-item">
                        <a class="navbar-brand" href="#">
                            <i class="fas fa-book-open"></i>  単語帳
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="nav-link">{{ user }}님 반갑습니다.</span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/common/profile/">프로필</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/common/logout/">로그아웃</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/common/login/">로그인</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <!--// navbar -->

    <div class="container">
        <div class="card">
            <div class="card-header">
                단어 목록
            </div>
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    {% block script %}
    {% endblock %}
</body>
</html>
